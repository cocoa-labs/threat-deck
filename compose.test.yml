name: threatdeck-release-test
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: threatdeck_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    ports: ['127.0.0.1:55436:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d threatdeck_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56380:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
