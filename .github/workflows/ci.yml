name: Release checks
on:
  push:
    branches: [main, 'codex/release-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run check && npm run lint
      - run: npm run test:unit
      - run: docker compose -f compose.test.yml up -d --wait
      - run: npm run test:db:prepare && npm run test:integration
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/check-licenses.mjs && npm audit --audit-level=high
      - run: docker compose -f compose.test.yml down -v
        if: always()
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - run: docker build -t threatdeck:smoke .
      - run: docker compose -f compose.test.yml up -d --wait
      - run: docker run --rm --network threatdeck-release-test_default -e DATABASE_URL=postgresql://test:test-only-password@postgres:5432/threatdeck_test threatdeck:smoke npm run db:migrate
      - run: npm run test:container
      - run: docker compose -f compose.test.yml down -v
        if: always()
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan source and history with pinned Gitleaks
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/checksums.txt
          cd /tmp
          mv gitleaks.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --config .gitleaks.toml
          /tmp/gitleaks dir --redact --config .gitleaks.toml
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
