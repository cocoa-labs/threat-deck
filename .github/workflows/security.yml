name: Static security analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned scanner and official community rules
        shell: bash
        run: |
          python3 -m venv /tmp/semgrep-env
          /tmp/semgrep-env/bin/pip install semgrep==1.182.1
          curl -fsSL https://github.com/semgrep/semgrep-rules/archive/16b9e6d45f10649f6a531ec4838ed9924372c3bc.tar.gz -o /tmp/rules.tar.gz
          echo '098703252fbff4c04186e7b6dd06f9a6a03fb548778341056a945e099ec2a824  /tmp/rules.tar.gz' | sha256sum -c -
          mkdir /tmp/semgrep-rules
          tar xzf /tmp/rules.tar.gz -C /tmp/semgrep-rules --strip-components=1
      - name: Scan and enforce reviewed security findings
        shell: bash
        run: |
          /tmp/semgrep-env/bin/semgrep scan --config /tmp/semgrep-rules/javascript --config /tmp/semgrep-rules/typescript --metrics off --disable-version-check --json --output /tmp/semgrep.json src server.ts next.config.ts
          node scripts/check-static-analysis.mjs /tmp/semgrep.json
  analyze:
    # CodeQL is free for the public release. Private staging uses Semgrep above.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
